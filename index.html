<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>ログ - 行動記録</title>
<meta name="description" content="1日の行動をバーチカルタイムラインで記録・可視化するアプリ">
<!-- 個人用アプリのため検索結果に出さない（ブログとは別物として扱う） -->
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#111318" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ログ">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="appbar">
  <div class="appbar-inner">
    <div class="appbar-title" id="appbarTitle">タイムライン</div>
    <div class="appbar-actions" id="appbarActions"></div>
  </div>
  <div class="datebar" id="datebar">
    <button class="iconbtn" id="prevDay" aria-label="前の日">‹</button>
    <button class="datelabel" id="dateLabel" aria-label="日付を選択">
      <input type="date" id="datePicker" aria-label="日付">
      <span id="dateText"></span>
    </button>
    <button class="iconbtn" id="nextDay" aria-label="次の日">›</button>
    <button class="todaybtn" id="todayBtn">今日</button>
  </div>
</header>

<main id="main">

  <!-- ── タイムライン ── -->
  <section class="view" id="view-timeline" data-view="timeline">
    <div class="quickbar" id="quickBar"></div>
    <div id="runningBox"></div>
    <div class="daystats" id="dayStats"></div>
    <div class="timeline-wrap">
      <div class="timeline" id="timeline"></div>
    </div>
  </section>

  <!-- ── サマリー ── -->
  <section class="view" id="view-summary" data-view="summary" hidden>
    <div class="seg" id="rangeSeg" role="tablist">
      <button class="seg-btn is-on" data-mode="week">週</button>
      <button class="seg-btn" data-mode="month">月</button>
      <button class="seg-btn" data-mode="quarter">3ヶ月</button>
    </div>
    <div class="datebar" id="summaryDatebar">
      <button class="iconbtn" id="summaryPrev" aria-label="前の期間">‹</button>
      <div class="datelabel" id="summaryLabel"></div>
      <button class="iconbtn" id="summaryNext" aria-label="次の期間">›</button>
      <button class="todaybtn" id="summaryToday">今</button>
    </div>
    <div id="summaryBody"></div>
  </section>

  <!-- ── 検索 ── -->
  <section class="view" id="view-search" data-view="search" hidden>
    <div class="searchbar">
      <input type="search" id="searchInput" placeholder="メモ・カテゴリを検索" autocomplete="off">
    </div>
    <div class="chiprow" id="searchFilters"></div>
    <div id="searchResults"></div>
  </section>

  <!-- ── 設定 ── -->
  <section class="view" id="view-settings" data-view="settings" hidden>
    <div id="settingsBody"></div>
  </section>

</main>

<button class="fab" id="fab" aria-label="記録を追加">＋</button>

<nav class="tabbar" id="tabbar">
  <button class="tab is-on" data-tab="timeline"><span class="tab-ico">▤</span><span>タイムライン</span></button>
  <button class="tab" data-tab="summary"><span class="tab-ico">▥</span><span>サマリー</span></button>
  <button class="tab" data-tab="search"><span class="tab-ico">⌕</span><span>検索</span></button>
  <button class="tab" data-tab="settings"><span class="tab-ico">⚙</span><span>設定</span></button>
</nav>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"></div>

<div class="report" id="report" hidden role="dialog" aria-modal="true" aria-label="受診用レポート"></div>

<div class="toast" id="toast" hidden></div>

<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/timeline.js"></script>
<script src="js/summary.js"></script>
<script src="js/report.js"></script>
<script src="js/app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>ログ - 体調と暮らしの記録</title>
<meta name="description" content="睡眠・服薬・体調を1日のタイムラインで記録して、受診のときに1枚のレポートとして持っていけるアプリ。記録はお使いの端末の中だけに保存されます。">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0d1015" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f7" media="(prefers-color-scheme: light)">

<!-- LINEなどでURLを共有したときの見え方 -->
<meta property="og:type" content="website">
<meta property="og:title" content="ログ - 体調と暮らしの記録">
<meta property="og:description" content="睡眠・服薬・体調を1日のタイムラインで記録して、受診のときに1枚のレポートとして持っていけるアプリ。記録はお使いの端末の中だけに保存されます。">
<meta property="og:url" content="https://app.oshihitsuji.jp/">
<meta property="og:image" content="https://app.oshihitsuji.jp/icons/icon-512.png">
<meta property="og:locale" content="ja_JP">
<meta name="twitter:card" content="summary">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ログ">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="appbar">
  <div class="datebar" id="datebar">
    <button class="iconbtn" id="prevDay" aria-label="前の日">‹</button>
    <button class="datelabel" id="dateLabel" aria-label="日付を選択（カレンダー）">
      <span id="dateText"></span>
    </button>
    <button class="iconbtn" id="nextDay" aria-label="次の日">›</button>
    <button class="todaybtn" id="todayBtn">今日</button>
  </div>
</header>

<main id="main">

  <!-- ── タイムライン ── -->
  <section class="view" id="view-timeline" data-view="timeline">
    <div id="installTip"></div>
    <div id="nudgeBox"></div>
    <div id="runningBox"></div>
    <div class="daystats" id="dayStats"></div>
    <div class="timeline-wrap">
      <div class="timeline" id="timeline"></div>
    </div>
    <div class="tl-dock">
      <div class="dock-zone dock-span">
        <button class="dock-fab" id="dockFab" aria-label="記録を追加">＋</button>
        <div class="dock-span-qbs" id="dockSpanQbs"></div>
      </div>
      <div class="dock-zone dock-point" id="dockPoint"></div>
      <div class="dock-zone dock-scale" id="dockScale"></div>
    </div>
  </section>

  <!-- ── サマリー ── -->
  <section class="view" id="view-summary" data-view="summary" hidden>
    <div class="seg" id="rangeSeg" role="tablist">
      <button class="seg-btn is-on" data-mode="week">週</button>
      <button class="seg-btn" data-mode="month">月</button>
      <button class="seg-btn" data-mode="quarter">3ヶ月</button>
    </div>
    <div class="datebar" id="summaryDatebar">
      <button class="iconbtn" id="summaryPrev" aria-label="前の期間">‹</button>
      <div class="datelabel" id="summaryLabel"></div>
      <button class="iconbtn" id="summaryNext" aria-label="次の期間">›</button>
      <button class="todaybtn" id="summaryToday">今</button>
    </div>
    <div id="summaryBody"></div>
  </section>

  <!-- ── 検索 ── -->
  <section class="view" id="view-search" data-view="search" hidden>
    <div class="searchbar">
      <input type="search" id="searchInput" placeholder="メモ・カテゴリを検索" autocomplete="off">
    </div>
    <div class="chiprow" id="searchFilters"></div>
    <div id="searchResults"></div>
  </section>

  <!-- ── 設定 ── -->
  <section class="view" id="view-settings" data-view="settings" hidden>
    <div id="settingsBody"></div>
  </section>

</main>

<button class="fab" id="fab" aria-label="記録を追加">＋</button>

<nav class="tabbar" id="tabbar">
  <button class="tab is-on" data-tab="timeline"><span class="tab-ico">▤</span><span>タイムライン</span></button>
  <button class="tab" data-tab="summary"><span class="tab-ico">▥</span><span>サマリー</span></button>
  <button class="tab" data-tab="search"><span class="tab-ico">⌕</span><span>検索</span></button>
  <button class="tab" data-tab="settings"><span class="tab-ico">⚙</span><span>設定</span></button>
</nav>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"></div>

<div class="report" id="report" hidden role="dialog" aria-modal="true" aria-label="受診用レポート"></div>

<div class="toast" id="toast" hidden></div>

<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/timeline.js"></script>
<script src="js/summary.js"></script>
<script src="js/report.js"></script>
<script src="js/export.js"></script>
<script src="js/notify.js"></script>
<script src="js/app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
</body>
</html>

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時に走らせない。進行中のデプロイは中断せず完了させる。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 公開するファイルだけを集める
        run: |
          # index.html を持つフォルダを1つのアプリとみなして、そのまま並べる。
          # アプリを増やすときはフォルダを足すだけでよく、ここは触らなくていい。
          mkdir -p _site
          for dir in */; do
            [ -f "${dir}index.html" ] || continue
            echo "アプリとして公開: ${dir}"
            cp -r "${dir}" _site/
          done
          # ドメイン直下にはアプリを置かない。サイト全体のものだけ。
          cp robots.txt _site/
          # カスタムドメインを使う場合はリポジトリ直下の CNAME をサイトのルートに配置する
          if [ -f CNAME ]; then cp CNAME _site/; fi
          # README は公開しない
          rm -f _site/*/README.md
          touch _site/.nojekyll

      # enablement による自動有効化は GITHUB_TOKEN の権限では行えないため使わない。
      # Pages の有効化は Settings → Pages から一度だけ手動で行う。
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
